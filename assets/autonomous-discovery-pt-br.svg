  <text x="64" y="592" font-family="Georgia, serif" font-size="22" font-weight="normal" fill="#132d49" text-anchor="start">Martin Cifuentes</text>
  <text x="1136" y="592" font-family="Segoe UI, sans-serif" font-size="19" font-weight="normal" fill="#27736e" text-anchor="end">Núcleo de raciocínio científico implementado  ·  Verificação em andamento</text>
