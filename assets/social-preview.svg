<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Accessible Computational Drug Discovery</title>
  <desc id="description">A project by Martin Cifuentes. Designing integrated computational workflows for small-molecule discovery. Establish, Explore, Investigate, Interpret, Decide; revisit as needed. New evidence can enter throughout and independent questions can progress concurrently. Practitioner validation in progress.</desc>
