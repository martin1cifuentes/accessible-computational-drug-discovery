<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Autonomous Computational Aided Drug Discovery</title>
  <desc id="description">A project by Martin Cifuentes. Interpret evidence, learn contextual relationships and choose a useful investigation. New results inform subsequent decisions. Scientific reasoning core implemented; verification in progress.</desc>
