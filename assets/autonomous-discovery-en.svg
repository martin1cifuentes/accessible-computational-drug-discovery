  <text x="60" y="236" font-family="Georgia, serif" font-size="73" font-weight="normal" fill="#132d49" text-anchor="start">Aided Drug Discovery</text>
  <text x="64" y="293" font-family="Segoe UI, sans-serif" font-size="27" font-weight="normal" fill="#40566b" text-anchor="start">Learning which molecular changes matter and what to investigate next.</text>
