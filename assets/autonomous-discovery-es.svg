  <rect x="366.5" y="478" width="467" height="29" fill="#fff" />
  <text x="600" y="500" font-family="Segoe UI, sans-serif" font-size="19" font-weight="normal" fill="#40566b" text-anchor="middle">Los nuevos resultados orientan la siguiente decisión</text>
